[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_algo"
version = "2.0.0"
description = "Financial algorithm library for portfolio analysis and trading signals"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "yfinance>=0.2",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "alpaca-py>=0.30",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
edgar = [
    "edgartools>=3.0",
]
reporting = [
    "quantstats>=0.0.62",
    "matplotlib>=3.5",
]
research = [
    "vectorbt>=0.26",
]
dl = [
    "chronos-forecasting>=1.0",
]
all = [
    "financial_algo[dev,reporting,research,dl]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
reportMissingImports = false
